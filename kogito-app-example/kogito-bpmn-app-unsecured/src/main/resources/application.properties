quarkus.datasource.jdbc.tracing=false

quarkus.datasource."xos".db-kind=postgresql
quarkus.datasource."xos".jdbc.transactions=disabled

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.transactions=xa
quarkus.datasource.jdbc.driver=org.postgresql.xa.PGXADataSource

quarkus.datasource."processpaas".db-kind=postgresql
quarkus.datasource."processpaas".jdbc.transactions=xa
quarkus.datasource."processpaas".jdbc.driver=org.postgresql.xa.PGXADataSource

quarkus.transaction-manager.object-store.create-table=true
quarkus.transaction-manager.object-store.datasource=xos
quarkus.transaction-manager.enable-recovery=true
quarkus.transaction-manager.object-store.type=jdbc

quarkus.hibernate-orm.sql-load-script=process_paas_database.sql
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.validate-in-dev-mode=false

quarkus.hibernate-orm.packages=org.kie.kogito, org.jbpm.usertask.jpa.model
quarkus.hibernate-orm."processpaas".datasource=processpaas
quarkus.hibernate-orm."processpaas".database.generation=update
quarkus.hibernate-orm."processpaas".database.generation.create-schemas=true
#quarkus.hibernate-orm."process-paas".database.default-schema=process-paas
quarkus.hibernate-orm."processpaas".packages=com.santander.model

%dev.quarkus.wiremock.devservices.enabled=true
%dev.quarkus.wiremock.devservices.files-mapping=src/main/resources/wiremock/dummy
%dev.quarkus.wiremock.devservices.port=9002
%dev.quarkus.wiremock.devservices.reload=true
%dev.quarkus.rest-client."dummy-rest-service".url=http://localhost:${%dev.quarkus.wiremock.devservices.port}

